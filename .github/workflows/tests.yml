name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: every experiment script parses (the experiments themselves need PyTorch and are not run here)
        run: python -m py_compile *.py controls/*.py
      - name: auditability checks (self-test, retractions, claims index, manifest)
        run: python -I research_grade.py
      - name: ledger -> plasticity bridge, driven both ways (stdlib only; no Brian2/PyTorch)
        run: python -I test_ledger_bridge.py
